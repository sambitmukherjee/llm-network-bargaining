[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-network-bargaining"
version = "0.1.0"
description = "Reproducible network bargaining experiments and theory benchmarks"
requires-python = ">=3.11"
dependencies = ["networkx", "numpy", "scipy", "pydantic>=2", "pyyaml", "openai>=3.35.1,<4", "pandas>=2.2,<4", "statsmodels>=0.14.4", "matplotlib>=3.9"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-m "not slow"'
markers = ["slow: optional tests of the exact-enumeration size limit"]
